aid: 9count
name: 9 Count
description: >-
  9 Count, Inc. is a Los Angeles (Venice, CA) consumer mobile app studio founded in 2018 by Alex
  Hofmann, the former CEO of musical.ly, and Joe Viola. The company builds, tests and
  cross-promotes a portfolio of social-connection applications rather than a single product,
  iterating on each with usage data and customer feedback. Its flagship is Wink, an AI-assisted
  friend-making and dating app that matches on personality, stated intent and real-world
  interests instead of swipe-first selection, and it acquired the LGBTQ+ social and personals app
  Lex in September 2024. Earlier titles include the dating app Summer, social arcade app Juju and
  the creator-fan app Popstream. 9 Count has raised roughly $27.5M across three rounds. It is a
  business-to-consumer studio: its products ship as end-user mobile applications through the App
  Store and Google Play, and as of a 2026-09-05 probe it publishes no public API, SDK, webhook
  surface, developer portal or machine-readable specification of any kind.
